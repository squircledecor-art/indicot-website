<html lang="en">
<head>

<style>
  :root{
    --sans:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    --mono-f:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root{
    --navy:#1E1B6C; --navy2:#2a2694; --cream:#f4f0e8; --ink:#1a1a2e;
    --gold:#F7B500; --green:#009640; --line:rgba(30,27,108,.12); --muted:#6b6b80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--cream); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:15px 30px;background:rgba(244,240,232,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar .lg img{height:30px;display:block}
  .topbar nav{display:flex;align-items:center;gap:24px}
  .topbar nav a{color:var(--navy);text-decoration:none;font-size:13.5px;font-weight:600}
  .topbar nav a:hover{color:var(--gold)}
  .topbar .ph{font-family:var(--mono-f);font-size:13px}
  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 24px}
  @media(max-width:620px){.topbar nav a:not(.ph){display:none}.topbar{padding:12px 18px}.main{padding:22px 16px}}
  .wrap{width:100%; max-width:720px}
  .card{
    background:#fff; border-radius:24px; padding:40px 38px 34px;
    box-shadow:0 30px 80px -30px rgba(30,27,108,.35), 0 2px 8px rgba(30,27,108,.06);
    position:relative; overflow:hidden;
  }
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold) 40%,#fff 40%,#fff 46%,var(--green) 46%);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mark span{color:#fff;font-weight:800;font-size:18px;line-height:1;transform:translateY(-1px)}
  .brand b{color:var(--navy);font-size:15px;letter-spacing:.5px}
  .eyebrow{font-family:var(--mono-f);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
    color:var(--gold);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  h1{font-size:27px;line-height:1.18;color:var(--navy);margin-bottom:6px;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:26px;line-height:1.5}
  .progress{display:flex;gap:6px;margin-bottom:26px}
  .progress i{height:4px;flex:1;border-radius:4px;background:var(--line);transition:.4s}
  .progress i.on{background:var(--navy)}
  .opts{display:grid;gap:12px}
  .opt{
    text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:15px;
    padding:17px 18px;cursor:pointer;display:flex;align-items:center;gap:15px;
    transition:transform .15s,border-color .15s,box-shadow .15s;font:inherit;width:100%;
  }
  .opt:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(30,27,108,.4)}
  .opt .ic{width:44px;height:44px;border-radius:11px;background:var(--cream);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .opt .t{display:block;font-weight:700;font-size:15.5px;color:var(--ink);margin-bottom:3px}
  .opt .d{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
  .opt>span:nth-child(2){display:block;min-width:0}
  .opt .arw{margin-left:auto;color:var(--navy);opacity:0;transform:translateX(-6px);transition:.15s;font-size:18px;flex:0 0 auto}
  .opt:hover .arw{opacity:1;transform:translateX(0)}
  .back{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;
    margin-top:20px;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--navy)}
  /* result */
  .res{text-align:center;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  .res .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(0,150,64,.1);
    color:var(--green);font-weight:700;font-size:12px;padding:7px 14px;border-radius:30px;margin-bottom:16px;letter-spacing:.3px}
  .res h2{font-size:26px;color:var(--navy);line-height:1.2;margin-bottom:4px;letter-spacing:-.4px}
  .res .cat{font-family:var(--mono-f);font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px}
  .res .why{font-size:15px;color:#2a2a3a;line-height:1.6;max-width:480px;margin:0 auto 24px;
    background:var(--cream);padding:18px 20px;border-radius:14px;text-align:left}
  .res .why b{color:var(--navy)}
  .actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;
    font-weight:700;font-size:14px;text-decoration:none;border:none;cursor:pointer;transition:.15s;font-family:inherit}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy2);transform:translateY(-2px)}
  .btn-wa{background:var(--green);color:#fff}
  .btn-wa:hover{filter:brightness(1.07);transform:translateY(-2px)}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--navy)}
  .restart{margin-top:22px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px}
  .foot b{color:var(--navy)}
  @media(max-width:560px){.card{padding:30px 22px 26px}h1{font-size:23px}.res h2{font-size:22px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="lg" href="index.html"><img src="assets/indiacot-logo-trim.png" alt="Indiacot"></a>
  <nav>
    <a href="index.html#machines">Machines</a>
    <a href="roi.html">ROI Calculator</a>
    <a href="index.html#castcure">Cast &amp; Cure</a>
    <a href="index.html#enquire">Contact</a>
    <a class="ph" href="tel:+919624186098">+91 96241 86098</a>
  </nav>
</header>
<div class="main">
<div class="wrap">
  <div class="card">
    <div id="stage"></div>
    <div class="foot">Print finishing machines · Rajkot, India · <b>800+ installations · 50+ countries</b></div>
  </div>
</div>
</div>

<script>
const WA='919624186098';
const BASE='https://indiacot.com/products/';

// machines
const M={
  ifoil_online:{name:'i-Foil Online',cat:'Inline Foiling · Spot UV · Cast & Cure',slug:'i-foil-online',
    why:'Attaches to your <b>automatic screen press</b> for inline foiling at production volume — flat, tactile and 3D foil plus Spot UV and Cast & Cure, with no dies and minimal foil waste.'},
  ifoil_semi:{name:'i-Foil Semi-Automatic',cat:'Screen + Foil · Semi-Automatic',slug:'i-foil-semi-automatic',
    why:'A <b>flatbed screen + foiling</b> setup — the practical entry into foil, Spot UV and Cast & Cure effects, single-operator with a servo take-off. Ideal when you want the effects without a full automatic line.'},
  foil_fusing:{name:'Foil Fusing Machine',cat:'Foil Fusing · Glazing',slug:'foil-fusing',
    why:'Built for printers <b>already running a screen-printing unit</b> who want to add hot, embossed and 3D high-build foil to their sheets.'},
  comp_fusing:{name:'Comp. Foil Fusing Machine',cat:'Foil Fusing · Compact',slug:'comp-foil-fusing',
    why:'The same foil-fusing power in a <b>compact footprint</b> — made for label shops, short runs and tighter floors.'},
  gst1060:{name:'Auto Screen with Industrial Foiler (GST1060)',cat:'Inline UV Spot · Cold Foil',slug:'gst1060-cold-foil',
    why:'A fully automatic stop-cylinder line combining <b>UV spot varnish and cold foil</b> in one inline pass — for paper packaging, labels and decals at speed.'},
  screen:{name:'Screen Printing Machine',cat:'Screen Printing · Semi / Full Auto',slug:'screen-printing',
    why:'An electric flat-bed screen printer for <b>paper, board, membrane switches, FPC and nameplates</b> — sharp, consistent prints in manual, semi or full-auto.'},
  lamination:{name:'Lamination Machine',cat:'Dual-Side Thermal',slug:'lamination',
    why:'Dual-side thermal lamination for <b>digital prints</b> — mirror-chromed rollers give a high-gloss, feather-touch finish on covers, brochures and cartons.'},
  film:{name:'Automatic Film Laminating Machine',cat:'High-Speed · Flying Knife',slug:'film-laminating',
    why:'High-speed <b>glue-base and thermal film lamination</b> up to 105 m/min with a servo flying knife — for covers, folding cartons, luxury packaging and premium labels.'},
};

// flow
const Q1={
  q:'What are you trying to do?',
  sub:'Pick what matters most for your work — we’ll point you to the right machine.',
  opts:[
    {ic:'✨',t:'Add foil / metallic & 3D effects',d:'Hot foil, embossed, high-build 3D foil',go:'foil'},
    {ic:'💎',t:'Spot UV, gloss & holographic',d:'Spot UV varnish, Cast & Cure, cold foil, hologram',go:'gloss'},
    {ic:'🖨️',t:'Screen printing',d:'Paper, board, FPC, membrane, nameplates',go:'screen'},
    {ic:'🌟',t:'Lamination',d:'Protect & finish with film lamination',go:'lam'},
  ]
};
const Q2={
  foil:{q:'How do you run your foil work?',sub:'This decides the right foil machine for your floor.',opts:[
    {ic:'⚡',t:'Inline on an automatic screen press',d:'High volume, continuous production',res:'ifoil_online'},
    {ic:'🧰',t:'Flatbed / semi-automatic setup',d:'Entry into foil, Spot UV & Cast & Cure',res:'ifoil_semi'},
    {ic:'🏭',t:'I already screen-print, want to add foil',d:'Add hot, embossed & 3D foil fusing',res:'foil_fusing'},
    {ic:'🏷️',t:'Label shop / short runs / tight space',d:'Compact foil fusing',res:'comp_fusing'},
  ]},
  gloss:{q:'What’s your main surface & setup?',sub:'',opts:[
    {ic:'📦',t:'Packaging, labels & decals — inline',d:'UV spot + cold foil in one pass',res:'gst1060'},
    {ic:'✨',t:'Spot UV & Cast & Cure via a foil system',d:'On an automatic screen press',res:'ifoil_online'},
  ]},
  lam:{q:'What are you laminating?',sub:'',opts:[
    {ic:'🖼️',t:'Digital prints — covers, brochures',d:'Dual-side thermal, high-gloss finish',res:'lamination'},
    {ic:'📘',t:'High-speed: book covers, cartons, packaging',d:'Fast film lamination with flying knife',res:'film'},
  ]},
  screen:null, // direct result
};

let step=0, path=[];
const stage=document.getElementById('stage');

function prog(n){let s='';for(let i=0;i<3;i++)s+=`<i class="${i<n?'on':''}"></i>`;return `<div class="progress">${s}</div>`;}

function renderQ(q,level,backable){
  let html=prog(level);
  html+=`<div class="eyebrow"><span class="dot"></span>Step ${level} of ${q===Q1?'2':'2'}</div>`;
  html+=`<h1>${q.q}</h1>`;
  if(q.sub)html+=`<p class="sub">${q.sub}</p>`;
  html+='<div class="opts">';
  q.opts.forEach((o,i)=>{
    html+=`<button class="opt" data-i="${i}"><span class="ic">${o.ic}</span>
      <span><span class="t">${o.t}</span><span class="d">${o.d}</span></span>
      <span class="arw">→</span></button>`;
  });
  html+='</div>';
  if(backable)html+=`<button class="back" id="back">← Back</button>`;
  stage.innerHTML=html;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(q,+b.dataset.i));
  const bk=document.getElementById('back'); if(bk)bk.onclick=goBack;
}

function pick(q,i){
  const o=q.opts[i];
  if(q===Q1){
    path=[i];
    if(o.go==='screen'){showResult('screen');return;}
    renderQ(Q2[o.go],2,true); step=2; current=o.go;
  }else{
    showResult(o.res);
  }
}
let current=null;

function goBack(){ step=0; current=null; renderQ(Q1,1,false); }

function showResult(key){
  const m=M[key];
  const url=BASE+m.slug+'.html';
  const wa=`https://wa.me/${WA}?text=`+encodeURIComponent(`Hello Indiacot, I'm interested in the ${m.name}. Please share details and pricing.`);
  stage.innerHTML=`
    <div class="res">
      <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div>
      <div class="badge">✓ Your recommended machine</div>
      <h2>${m.name}</h2>
      <div class="cat">${m.cat}</div>
      <p class="why">${m.why}</p>
      <div class="actions">
        <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">View machine →</a>
        <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">Get a quote on WhatsApp</a>
      </div>
      <button class="back restart" id="restart">↻ Start over</button>
    </div>`;
  document.getElementById('restart').onclick=goBack;
}

renderQ(Q1,1,false);
</script>
</body>
</html>
